# Roda os testes sozinho, pra eu saber se quebrei alguma coisa.
# Só no push da main e nos pull requests, senão a branch do PR roda duas vezes
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      # se der erro numa versão, continua testando a outra
      fail-fast: false
      matrix:
        # 3.10 é a versão mínima que o projeto suporta
        python-version: ["3.10", "3.12"]

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # antes de instalar qualquer coisa, garante que o programa de terminal
      # continua funcionando só com a biblioteca padrão
      - name: Testa o programa de terminal sem dependências
        run: python -m unittest

      - name: Instala as dependências
        run: pip install -r requirements-dev.txt

      - name: Roda todos os testes (incluindo a API)
        run: python -m unittest -v
