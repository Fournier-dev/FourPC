# Roda os testes sozinho a cada push, pra eu saber se quebrei alguma coisa
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      # se der erro numa versão, continua testando a outra
      fail-fast: false
      matrix:
        # 3.10 é a versão mínima que o projeto suporta
        python-version: ["3.10", "3.12"]

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Roda os testes
        run: python -m unittest -v
